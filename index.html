<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Advanced Task Manager</h1>
            <nav>
                <a href="index.html" class="active">Tasks</a>
                <a href="statistics.html">Statistics</a>
                <a href="info.json" target="_blank">App Info</a>
            </nav>
        </header>

        <section class="card">
            <h2>Categories</h2>
            <form id="category-form" class="inline-form">
                <input type="text" id="category-name" placeholder="New category name (e.g., Study)" required>
                <button type="submit">Add Category</button>
            </form>
            <div id="category-list" class="badge-list"></div>
        </section>

        <section class="card">
            <h2 id="form-title">Create New Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <input type="text" id="task-title" placeholder="Task title" required>
                <textarea id="task-description" placeholder="Task description (optional)"></textarea>
                <select id="task-category" required>
                    <option value="">Select a category...</option>
                </select>
                <div class="form-actions">
                    <button type="submit" id="save-task-btn">Add Task</button>
                    <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Filter Tasks</h2>
            <div class="filters">
                <select id="filter-category">
                    <option value="all">All Categories</option>
                </select>
                <select id="filter-status">
                    <option value="all">All Statuses</option>
                    <option value="false">Incomplete Only</option>
                    <option value="true">Completed Only</option>
                </select>
            </div>
        </section>

        <section class="card">
            <h2>Tasks</h2>
            <ul id="task-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
